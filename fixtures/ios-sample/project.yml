name: PhoneDockSample
options:
  bundleIdPrefix: dev.phonedock
  deploymentTarget:
    iOS: "17.0"
targets:
  PhoneDockSample:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phonedock.sample
        PRODUCT_NAME: PhoneDockSample
        INFOPLIST_KEY_CFBundleDisplayName: PhoneDock Sample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
